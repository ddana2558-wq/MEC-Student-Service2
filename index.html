<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEC Student Voice</title>
  <style>
    :root{--p:#1a56db;--bg:#f8fafc;--card:#fff;--t:#1e293b}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:20px;line-height:1.6}
    .wrap{max-width:900px;margin:auto}
    .card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:20px}
    h2{color:var(--p);margin-top:0}
    input,select,textarea{width:100%;padding:10px;margin:6px 0 15px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
    button{background:var(--p);color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:15px}
    .stat{background:#eef2ff;padding:10px;border-radius:8px;text-align:center}
    .stat span{font-size:24px;font-weight:700;color:var(--p)}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}
    .hidden{display:none}
    .nav{display:flex;justify-content:space-between;margin-bottom:20px}
    .nav a{text-decoration:none;color:var(--p);cursor:pointer;padding:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="nav"><h2>🎓 MEC Voice</h2><div><a onclick="show('student')">👤 طالب</a> | <a onclick="show('admin-login')">📊 أدمن</a></div></div>

  <div id="sec-student" class="card">
    <h2>📝 إرسال شكوى / مقترح</h2>
    <form id="reportForm">
      <input type="text" name="college_id" placeholder="College ID (e.g., 23f24545)" required>
      <select name="building" required><option value="">المبنى</option><option value="IBR">IBR</option><option value="IBK">IBK</option><option value="AKZ">AKZ</option><option value="STUDENT HUB">STUDENT HUB</option></select>
      <select name="service" required><option value="">الخدمة</option><option value="Academic Affairs">Academic Affairs</option><option value="IT Support">IT Support</option><option value="Facilities">Facilities</option></select>
      <select name="root_cause" required><option value="">السبب</option><option value="Technical">Technical</option><option value="Parking">Parking</option><option value="Session">Session</option></select>
      <textarea name="details" rows="3" placeholder="التفاصيل..." required></textarea>
      <select name="type" required><option value="complaint">📝 شكوى</option><option value="suggestion">💡 مقترح</option></select>
      <button type="submit">📤 إرسال</button>
    </form>
  </div>

  <div id="sec-admin-login" class="card hidden">
    <h2>🔐 دخول المسؤول</h2>
    <form id="loginForm">
      <input type="text" id="aid" placeholder="Student ID" required>
      <input type="password" id="pin" maxlength="4" placeholder="4-Digit PIN" required>
      <button type="submit">✅ دخول</button>
    </form>
  </div>

  <div id="sec-admin" class="card hidden">
    <h2>📊 Dashboard</h2>
    <div class="grid">
      <div class="stat"><span id="tot">0</span>الكل</div>
      <div class="stat"><span id="res">0</span>محلول</div>
      <div class="stat"><span id="pen">0</span>معلق</div>
      <div class="stat"><span id="sug">0</span>مقترح</div>
    </div>
    <button onclick="load()">🔄 تحديث</button>
    <table><thead><tr><th>ID</th><th>College ID</th><th>المبنى</th><th>النوع</th><th>الحالة</th><th>إجراء</th></tr></thead>
    <tbody id="tbl"><tr><td colspan="6">لا توجد بيانات</td></tr></tbody></table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 🔑 ضع بيانات مشروعك هنا
  const URL = 'https://YOUR_PROJECT_ID.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
  const {createClient} = supabase;
  const db = createClient(URL, KEY);
  const ADMINS = {'23f24545':'1111','23f24343':'2222','23f24557':'3333','23f24261':'4444','12a34567':'5555'};

  function show(v){
    document.getElementById('sec-student').classList.toggle('hidden', v!=='student');
    document.getElementById('sec-admin-login').classList.toggle('hidden', v!=='admin-login');
    document.getElementById('sec-admin').classList.add('hidden');
  }

  document.getElementById('reportForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const {error} = await db.from('mec_reports').insert({
      id: crypto.randomUUID(), college_id:f.college_id.value, building_name:f.building.value,
      service:f.service.value, root_cause:f.root_cause.value, details:f.details.value,
      type:f.type.value, status:'New', priority:'Low'
    });
    alert(error ? '❌ '+error.message : '✅ تم الإرسال');
    if(!error){ f.reset(); load(); }
  };

  document.getElementById('loginForm').onsubmit = e => {
    e.preventDefault();
    if(ADMINS[document.getElementById('aid').value] === document.getElementById('pin').value){
      document.getElementById('sec-admin-login').classList.add('hidden');
      document.getElementById('sec-admin').classList.remove('hidden');
      load();
    } else alert('❌ بيانات خاطئة');
  };

  window.load = async () => {
    const {data,error} = await db.from('mec_reports').select('*').order('created_at',{ascending:false});
    if(error) return console.error(error);
    document.getElementById('tot').textContent = data.length;
    document.getElementById('res').textContent = data.filter(r=>r.status==='Resolved').length;
    document.getElementById('pen').textContent = data.filter(r=>r.status!=='Resolved').length;
    document.getElementById('sug').textContent = data.filter(r=>r.type==='suggestion').length;
    document.getElementById('tbl').innerHTML = data.length ? data.map(r=>`
      <tr><td>${r.id.slice(0,8)}</td><td>${r.college_id}</td><td>${r.building_name}</td>
      <td>${r.type==='complaint'?'📝':'💡'}</td><td>${r.status}</td>
      <td><button onclick="upd('${r.id}')">تحديث</button></td></tr>`).join('') : '<tr><td colspan="6">فارغ</td></tr>';
  };

  window.upd = async id => {
    const s = prompt('الحالة الجديدة (New, In Progress, Resolved):');
    if(!['New','In Progress','Resolved'].includes(s)) return alert('غير صحيحة');
    const {error} = await db.from('mec_reports').update({status:s}).eq('id',id);
    alert(error?'❌ '+error.message:'✅');
    load();
  };
</script>
</body>
</html>
